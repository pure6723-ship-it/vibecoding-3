<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 모음</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }
        .folder-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .folder-card h2 {
            margin-top: 0;
            color: #3498db;
            font-size: 1.2rem;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        .link-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .link-item:hover {
            background: #3498db;
            color: #ffffff;
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.2);
        }
        .icon {
            margin-right: 12px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 내 프로젝트 목록</h1>

        <!-- Project 1 폴더 -->
        <div class="folder-card">
            <h2>📁 project1</h2>
            <div class="link-grid">
                <a href="project1/모둠편성.html" class="link-item">
                    <span class="icon">👥</span> 모둠편성
                </a>
                <a href="project1/발표자뽑기.html" class="link-item">
                    <span class="icon">🎤</span> 발표자뽑기
                </a>
            </div>
        </div>

        <!-- Project 2 폴더 -->
        <div class="folder-card">
            <h2>📁 project2</h2>
            <div class="link-grid">
                <a href="project2/칭찬스티커판.html" class="link-item">
                    <span class="icon">⭐</span> 칭찬스티커판
                </a>
                <a href="project2/타이머순서표.html" class="link-item">
                    <span class="icon">⏱️</span> 타이머순서표
                </a>
            </div>
        </div>

    </div>
</body>
</html>
