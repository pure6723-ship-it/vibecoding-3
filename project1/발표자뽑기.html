<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발표자 뽑기 프로그램</title>
    <style>
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-top: 0; }
        textarea { width: 100%; height: 80px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; resize: none; font-size: 15px; margin-bottom: 10px; }
        button { background-color: #4CAF50; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #drawBtn { background-color: #2196F3; font-size: 20px; padding: 15px 30px; }
        #drawBtn:hover { background-color: #1976D2; }
        .result-box { margin: 20px 0; padding: 40px 20px; background-color: #e3f2fd; border-radius: 12px; border: 2px dashed #2196F3; }
        .winner-name { font-size: 48px; font-weight: bold; color: #1565c0; word-break: keep-all; }
        .info-section { display: flex; justify-content: space-between; margin-top: 30px; text-align: left; }
        .info-box { width: 48%; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee; box-sizing: border-box; }
        .info-box h3 { margin-top: 0; font-size: 16px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 10px; }
        .tag { display: inline-block; background: #e0e0e0; padding: 6px 12px; border-radius: 20px; font-size: 14px; margin: 3px; }
        .tag.drawn { background: #ffebee; color: #c62828; text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 발표자 뽑기</h1>

        <textarea id="nameInput" placeholder="명단을 쉼표(,) 또는 줄바꿈으로 구분해서 입력하세요.&#13;&#10;예: 홍길동, 김철수, 이영희"></textarea>
        <div>
            <button id="setupBtn" onclick="setupList()">명단 등록/초기화</button>
        </div>

        <div class="result-box">
            <div id="winner" class="winner-name">대기 중...</div>
        </div>
        <button id="drawBtn" onclick="drawName()" disabled>🎯 뽑기 진행</button>

        <div class="info-section">
            <div class="info-box">
                <h3>남은 사람 (<span id="remainCount">0</span>)</h3>
                <div id="remainList">명단을 등록해주세요.</div>
            </div>
            <div class="info-box">
                <h3>뽑힌 사람 (<span id="drawnCount">0</span>)</h3>
                <div id="drawnList">아직 없습니다.</div>
            </div>
        </div>
    </div>

    <script>
        let remainingNames = [];
        let drawnNames = [];
        let isDrawing = false;

        function setupList() {
            const input = document.getElementById('nameInput').value;
            if (!input.trim()) {
                alert('명단을 입력해주세요!');
                return;
            }

            // 쉼표나 줄바꿈으로 분리 후 공백 제거, 빈 문자열 제외, 중복 제거
            let parsedNames = input.split(/[\n,]+/).map(name => name.trim()).filter(name => name !== '');
            remainingNames = [...new Set(parsedNames)];

            if (remainingNames.length === 0) {
                alert('유효한 명단이 없습니다.');
                return;
            }

            drawnNames = [];
            document.getElementById('winner').innerText = "누가 될까요?";
            document.getElementById('winner').style.color = "#1565c0";
            document.getElementById('drawBtn').disabled = false;

            updateUI();
        }

        function drawName() {
            if (isDrawing) return;
            if (remainingNames.length === 0) {
                alert('모든 발표자가 뽑혔습니다!');
                return;
            }

            isDrawing = true;
            const drawBtn = document.getElementById('drawBtn');
            drawBtn.disabled = true;
            const winnerElement = document.getElementById('winner');
            
            let count = 0;
            // 긴장감을 위한 룰렛 애니메이션 효과
            let shuffleInterval = setInterval(() => {
                const randomTempIndex = Math.floor(Math.random() * remainingNames.length);
                winnerElement.innerText = remainingNames[randomTempIndex];
                winnerElement.style.color = "#888";
                count++;

                if (count > 15) { 
                    clearInterval(shuffleInterval);

                    // 실제 당첨자 추출
                    const targetIndex = Math.floor(Math.random() * remainingNames.length);
                    const winner = remainingNames[targetIndex];

                    // 당첨자 제외 처리 (남은 명단에서 삭제하고 뽑힌 명단에 추가)
                    remainingNames.splice(targetIndex, 1);
                    drawnNames.push(winner);

                    // 결과 출력
                    winnerElement.innerText = `🎉 ${winner} 🎉`;
                    winnerElement.style.color = "#d32f2f";

                    updateUI();
                    isDrawing = false;
                    
                    if (remainingNames.length > 0) {
                        drawBtn.disabled = false;
                    }
                }
            }, 50); // 0.05초마다 이름 바뀜
        }

        function updateUI() {
            document.getElementById('remainCount').innerText = remainingNames.length;
            document.getElementById('drawnCount').innerText = drawnNames.length;

            const remainHtml = remainingNames.map(name => `<span class="tag">${name}</span>`).join('');
            document.getElementById('remainList').innerHTML = remainHtml || '모두 뽑혔습니다!';

            const drawnHtml = drawnNames.map(name => `<span class="tag drawn">${name}</span>`).join('');
            document.getElementById('drawnList').innerHTML = drawnHtml || '아직 없습니다.';
        }
    </script>
</body>
</html>
